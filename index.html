<!doctype html>
<html lang="en"><head>

<title>Netflix Secret Codes</title>
<style>
:root{--bg:#080808;--card:#151515;--line:#292929;--red:#e50914;--gold:#e7c46a;--muted:#aaa}

</style></head><body>

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function showHome(){history.pushState({page:"home"},"","#home");renderHome()}
function showCat(name,push=true){if(push)history.pushState({page:"cat",name},"","#"+encodeURIComponent(name));renderCat(name)}
function back(){history.back()}
function renderHome(){
document.title="Netflix Secret Codes";
topnav.innerHTML='<button class="navbtn home" onclick="showHome()">⌂ Home</button>';
app.innerHTML=`<section class="hero"><div class="eyebrow">Personal discovery console</div><h1>Pick a category.<br>Find your next watch.</h1><p>Twenty Netflix discovery categories in a clean 4 × 5 grid. Click any category to open its subcategories.</p></section><section class="wrap"><div class="grid">${ORDER.map((n,i)=>`<button class="category" onclick='showCat(${JSON.stringify(n)})'><div class="n">${String(i+1).padStart(2,"0")} / 20</div><h2>${esc(n)}</h2><div class="meta">${DATA[n].subs.length} subcategories</div><div class="arrow">→</div></button>`).join("")}</div></section>`;
footer.textContent="20 categories • Each subcategory launches the corresponding Netflix collection";
}
function renderCat(name){
const d=DATA[name], idx=ORDER.indexOf(name), prev=ORDER[idx-1], next=ORDER[idx+1];
document.title=name+" | Netflix Secret Codes";
topnav.innerHTML=`<button class="navbtn" onclick="back()">← Back</button><button class="navbtn home" onclick="showHome()">⌂ Home</button>`;
app.innerHTML=`<div class="breadcrumb"><button class="navbtn" onclick="back()">← Back</button> &nbsp; / &nbsp; <button class="navbtn home" onclick="showHome()">Home</button> &nbsp; / &nbsp; ${esc(name)}</div>
<section class="catHero"><div><div class="eyebrow">Category ${String(idx+1).padStart(2,"0")} / 20</div><h1>${esc(name)}</h1><div class="count">${d.subs.length} subcategories • Master code ${d.master}</div></div><div class="navs"><button class="navbtn" onclick="back()">← Back</button><button class="navbtn home" onclick="showHome()">⌂ Home</button><a class="navbtn" href="https://www.netflix.com/browse/genre/${d.master}">Open all ↗</a></div></section>
<section class="subgrid">${d.subs.map(([n,c])=>`<a class="sub" href="https://www.netflix.com/browse/genre/${c}"><span class="name">${esc(n)}</span><span class="code">${c}</span><span class="launch">WATCH ↗</span></a>`).join("")}</section>`;

}
window.onpopstate=()=>route();
function route(){const hash=decodeURIComponent(location.hash.slice(1)); if(hash&&DATA[hash]) renderCat(hash); else renderHome();}
route();
</script></body></html>
